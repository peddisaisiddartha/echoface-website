<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Silent Speech Assistant
  </title>

  <link rel="stylesheet"
        href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>

<body>

  <div class="container">

    <h1>
      Silent Speech Assistant
    </h1>

    <video id="video"
           autoplay
           muted>
    </video>

    <canvas id="canvas">
    </canvas>

    <button id="startBtn">
      Start Detection
    </button>

    <div id="status">
      Waiting...
    </div>

    <div id="chatBox">
    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
